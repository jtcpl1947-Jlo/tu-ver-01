name: tuver01
description: TU Ver 01 - JTCPL driver app (diesel, odometer, phone GPS) with admin screens.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: '>=3.6.0 <6.0.0'
  firebase_auth: '>=5.3.0 <8.0.0'
  cloud_firestore: '>=5.4.0 <8.0.0'
  geolocator: '>=13.0.0 <16.0.0'
  image_picker: '>=1.1.0 <2.0.0'
  google_mlkit_text_recognition: '>=0.13.0 <1.0.0'
  flutter_map: '>=7.0.0 <9.0.0'
  latlong2: '>=0.9.0 <1.0.0'
  intl: '>=0.19.0 <1.0.0'
  excel: '>=4.0.6 <5.0.0'
  pdf: '>=3.11.0 <4.0.0'
  web: '>=1.0.0 <2.0.0'
  file_saver: 0.2.14

flutter:
  uses-material-design: true
